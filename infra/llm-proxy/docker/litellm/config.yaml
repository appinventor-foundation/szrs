# max_tokens here is the output limit for requests that don't set their own.
# Zoom requests do: the proxy sends the zoom prompt's cap (32768, see
# apps/llm-proxy/src/zoom/prompts/params.ts), which overrides this value. Keep
# it set on every alias, so other callers get an explicit limit and not
# whatever default the provider applies.
model_list:
  - model_name: local-ollama
    litellm_params:
      model: os.environ/OLLAMA_MODEL
      api_base: os.environ/OLLAMA_API_BASE
      max_tokens: 8192

  - model_name: local-lmstudio
    litellm_params:
      model: openai/local-model
      api_base: os.environ/LMSTUDIO_API_BASE
      api_key: os.environ/LMSTUDIO_API_KEY
      max_tokens: 8192

  - model_name: openrouter
    litellm_params:
      model: os.environ/OPENROUTER_MODEL
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192

  # A second OpenRouter model on the same key, to compare two models side by side.
  - model_name: openrouter-2
    litellm_params:
      model: os.environ/OPENROUTER_MODEL_2
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 8192

  - model_name: gpt-4o-mini
    litellm_params:
      model: gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 8192

  - model_name: claude-3-5-sonnet
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  # Uncomment once AWS Bedrock credentials are available:
  # - model_name: bedrock-claude
  #   litellm_params:
  #     model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
  #     aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
  #     aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
  #     aws_region_name: os.environ/AWS_REGION_NAME
  #     max_tokens: 8192

litellm_settings:
  success_callback: ['langfuse']
  failure_callback: ['langfuse']

router_settings:
  fallbacks:
    - gpt-4o-mini: ['local-lmstudio', 'local-ollama']

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  salt_key: os.environ/LITELLM_SALT_KEY
