# LOCAL ONLY. Adds a wildcard OpenRouter route to LiteLLM for apps/evals (see
# docker/litellm/config.benchmark.yaml). Use it as a second -f file:
#
#   docker compose -f infra/llm-proxy/docker-compose.yml -f infra/llm-proxy/docker-compose.benchmark.yml up -d litellm
#
# Without it LiteLLM runs exactly as before. The Dokploy compose file does not use it.
services:
  litellm:
    volumes:
      - ./docker/litellm/config.benchmark.yaml:/app/config.benchmark.yaml:ro
    command: ['--config', '/app/config.benchmark.yaml']
