services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: llm_proxy
      POSTGRES_PASSWORD: llm_proxy
      POSTGRES_DB: llm_proxy
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (not .../data)
      # so they can manage a version-specific subdirectory themselves.
      - llm-proxy-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U llm_proxy']
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI: http://localhost:16686
      - '4318:4318' # OTLP/HTTP receiver

volumes:
  llm-proxy-pgdata:
