<!doctype html>
<html lang="en" data-theme="catppuccin" data-mode="light">
	<head>
		<title>web</title>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Applies the saved theme and mode before first paint, so a reload doesn't flash the
			defaults. Keys and theme names must match packages/ui/src/theme.svelte.ts.
		-->
		<script>
			(function () {
				var root = document.documentElement;
				function saved(key) {
					try {
						return localStorage.getItem(key);
					} catch (e) {
						return null;
					}
				}
				var theme = saved('szrs-theme');
				if (['catppuccin', 'mona', 'seafoam', 'vintage'].indexOf(theme) !== -1) {
					root.setAttribute('data-theme', theme);
				}
				var mode = saved('szrs-mode');
				if (mode !== 'light' && mode !== 'dark') {
					mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				root.setAttribute('data-mode', mode);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
