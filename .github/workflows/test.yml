name: Test

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm test:unit

  test-llm-proxy-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: llm_proxy
          POSTGRES_PASSWORD: llm_proxy
          POSTGRES_DB: llm_proxy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://llm_proxy:llm_proxy@localhost:5432/llm_proxy
      INTERNAL_API_KEY: test-secret
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @szrs/llm-proxy db:migrate

      - name: Run integration tests
        run: pnpm --filter @szrs/llm-proxy test:integration
